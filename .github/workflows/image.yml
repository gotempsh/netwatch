name: Image

# Builds ghcr.io/gotempsh/netwatch for linux/amd64 and linux/arm64 on native
# runners, then joins them into one multi-arch tag. Runs on release tags, or by
# hand for an existing tag: gh workflow run image.yml -f tag=v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (vX.Y.Z)
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      # Pushed by digest only; the merge job gives the joined image its tags.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - run: |
          mkdir -p digests
          d='${{ steps.build.outputs.digest }}'
          touch "digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # 0.1.0 always; latest only for releases without a suffix (not v0.2.0-rc.1).
      - id: tags
        run: |
          v=${TAG#v}
          tags="-t $IMAGE:$v"
          case "$v" in *-*) ;; *) tags="$tags -t $IMAGE:latest" ;; esac
          echo "args=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: |
          docker buildx imagetools create ${{ steps.tags.outputs.args }} \
            $(cd digests && printf "$IMAGE@sha256:%s " *)
      - id: inspect
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ steps.tags.outputs.version }}"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:${{ steps.tags.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
