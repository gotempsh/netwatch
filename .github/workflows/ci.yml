name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install eBPF toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup toolchain install nightly --profile minimal --component rust-src
          curl -fsSL "https://github.com/aya-rs/bpf-linker/releases/download/v0.12.0/bpf-linker-$(uname -m)-unknown-linux-musl.tar.zst" \
            | tar --zstd -x -C ~/.cargo/bin
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check -p netwatch
      # Tests run through `sudo -E` (.cargo/config.toml) because loading eBPF needs root.
      - run: cargo test -p netwatch

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p netwatch
